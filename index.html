<!DOCTYPE html>
<html>
    <head>
        <style>
           body {
            font-family: 'sugoe UI', system-ui,sans-serif;
            background-color: #f4f1ea;
            coolor: #2b2b2b;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
}
h1 {text-align: center;
color:#1081cc;}
h2 {
    color: #1081cc;
    border-bottom: 2px solid #ddd;
    padding-bottom: 5px;
}
button {
    display: block;
    margin: 20px auto;
    padding: 10px 24px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background-color: #1081cc;
    color: white;
    cursor: pointer;
}
button:hover {
    background-color: #083b5e;
}
ul {
    list-style-type: square;
}
body.dark {
    background-color: #1a1a1a;
    color: #f0f0f0;
}
body.dark h1,
body.dark h2 {
    color: #1081cc;
}
body.dark h2 {
    border-bottom-color: #444;
}
body.dark button {
    background-color: #1081cc;
    color: #1a1a1a;
}
        </style>
        <title>Bryce's Homepage </title>
    </head>
<body>
    <h1>Hi,I'm Bryce</h1>
    <p>This is my first website.</p>
<h2>About me</h2>
<p>I'm a journeyman plumber from TorC</p>
<h2>Things im into</h2>
<ul>
    <li>Sim racing</li>
<li>Forza Horizon</li>
<li>Cooking</li>
</ul>
<button id="randomBtn">Surprise me</button>
<p id="randomInterest"></p>
<script>
    const interests = ['Sim racing', 'Forza Horizon', 'Cooking']
    const randomBtn = document.getElementById('randomBtn')
    const display = document.getElementById('randomInterest');

    randomBtn.addEventListener('click', () => {
        const randomIndex = Math.floor(Math.random() * interests.length);
        display.textContent = interests[randomIndex];
    });
</script>
<button id="darkmodeBtn">Toggle Dark Mode</button>
<script>
    const darkmodeBtn = document.getElementById('darkmodeBtn');
    darkmodeBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark');
    });
</script>
</body>
</html>
